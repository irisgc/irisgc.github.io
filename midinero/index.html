<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Organiza tus ingresos, gastos fijos, suscripciones y ahorro mes a mes.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#15201d; --muted:#5d6b67; --line:#e2e8e6;
  --brand:#0f766e; --brand-soft:#d7efec; --in:#15803d; --in-soft:#dcfce7;
  --out:#c2410c; --out-soft:#ffedd5; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1412; --card:#18211e; --ink:#e7efec; --muted:#9aaba6; --line:#2a3632;
    --brand:#2dd4bf; --brand-soft:#123a35; --in:#4ade80; --in-soft:#143222;
    --out:#fb923c; --out-soft:#3a2414; --warn:#fbbf24; --warn-soft:#3a2f12;
    --bad:#f87171; --bad-soft:#3b1616; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar h1{font-size:19px;margin:0;text-transform:capitalize;text-align:center;flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:18px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--in)} .neg{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.catrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:9px 0}
.catrow .n{font-size:14px}
.catrow .a{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.catrow .bar{grid-column:1/-1;height:8px}
.catrow .d{font-size:12px;color:var(--muted);grid-column:1/-1}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--line);margin:6px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{display:flex;gap:10px;padding:10px;border-radius:12px;margin:8px 0;font-size:14px}
.tip .ic{font-size:18px;line-height:1.2}
.tip.good{background:var(--in-soft)} .tip.warn{background:var(--warn-soft)} .tip.bad{background:var(--bad-soft)} .tip.info{background:var(--brand-soft)}
/* sheet table */
.sheet{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sheet th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
.sheet td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.sheet td.num,.sheet th.num{text-align:right;white-space:nowrap}
.sheet tr.item{cursor:pointer}
.sheet tr.item:active{background:var(--brand-soft)}
.sheet tr.sec td{background:var(--bg);font-weight:700;font-size:13px;padding:8px 6px}
.sheet tr.tot td{font-weight:700}
.sheet .sub{display:block;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--brand-soft);color:var(--brand);margin-left:4px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#062c28}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}
@media (prefers-color-scheme: dark){.fab{color:#062c28}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:7}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;padding:9px 0 10px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on span{filter:none;opacity:1}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.modal{border-radius:20px}}
.modal h3{margin:0 0 12px;font-size:18px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.seg.in button.on{color:var(--in)} .seg.out button.on{color:var(--out)}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.yearbars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px;border-bottom:1px solid var(--line)}
.yearbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.yearbars .col i{display:block;width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--in)}
.yearbars .col i.n{background:var(--bad)}
.yearlbl{display:flex;gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-top:4px}
.yearlbl span{flex:1}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--brand-soft);border-radius:14px;padding:12px;margin:12px 0;font-size:14px}
.banner .row{margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap monthbar">
    <button class="iconbtn" id="prev" aria-label="Mes anterior">‹</button>
    <h1 id="monthTitle">—</h1>
    <button class="iconbtn" id="next" aria-label="Mes siguiente">›</button>
  </div>
</header>

<main class="wrap">
  <section id="view-resumen"></section>
  <section id="view-mov" class="hidden"></section>
  <section id="view-anio" class="hidden"></section>
  <section id="view-ajustes" class="hidden"></section>
</main>

<button class="fab" id="fab" aria-label="Añadir movimiento">+</button>

<nav class="tabs">
  <button data-tab="resumen" class="on"><span>📊</span>Resumen</button>
  <button data-tab="mov"><span>📋</span>Movimientos</button>
  <button data-tab="anio"><span>📅</span>Año</button>
  <button data-tab="ajustes"><span>⚙️</span>Ajustes</button>
</nav>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="mTitle">Nuevo movimiento</h3>
    <div class="seg" id="mType">
      <button data-v="gasto" class="on">Gasto</button>
      <button data-v="ingreso">Ingreso</button>
    </div>
    <label class="f">Tipo</label>
    <div class="seg" id="mGroup"></div>
    <label class="f" for="mName">Concepto</label>
    <input class="inp" id="mName" placeholder="Ej. Alquiler, Netflix, Mercadona…" autocomplete="off">
    <label class="f" for="mAmount">Importe</label>
    <input class="inp" id="mAmount" inputmode="decimal" placeholder="0,00">
    <label class="f" for="mCat">Categoría</label>
    <select class="inp" id="mCat"></select>
    <label class="f" for="mDate">Fecha (opcional)</label>
    <input class="inp" id="mDate" type="date">
    <label class="check"><input type="checkbox" id="mRec"> Se repite cada mes (se copia al mes siguiente)</label>
    <div class="row" style="margin-top:16px">
      <button class="btn danger hidden" id="mDel">Borrar</button>
      <button class="btn ghost" id="mCancel">Cancelar</button>
      <button class="btn" id="mSave">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
(() => {
'use strict';
const KEY = 'misfinanzas.v1';
const EXP_CATS = ['Vivienda','Suministros (luz, agua, gas, internet)','Supermercado','Restaurantes y bares','Ocio','Transporte','Coche','Suscripciones','Salud','Deporte','Ropa','Compras y hogar','Cuidado personal','Educación','Viajes','Regalos','Hijos','Mascotas','Seguros','Préstamos y deudas','Impuestos y comisiones','Ahorro / inversión','Otros'];
const INC_CATS = ['Nómina','Paga extra','Trabajos extra','Bizum / reembolsos','Ventas','Ayudas','Intereses / inversión','Otros ingresos'];
const NEEDS = new Set(['Vivienda','Suministros (luz, agua, gas, internet)','Supermercado','Transporte','Coche','Salud','Seguros','Préstamos y deudas','Impuestos y comisiones','Hijos']);
const GROUPS = {
  gasto: [['fijo','Fijo'],['suscripcion','Suscripción'],['variable','Variable']],
  ingreso: [['nomina','Nómina'],['extra','Extra']]
};
const GROUP_LABEL = {nomina:'Nómina',extra:'Otros ingresos',fijo:'Gastos fijos',suscripcion:'Suscripciones',variable:'Gastos variables'};
const GROUP_COLOR = {fijo:'#0f766e',suscripcion:'#7c3aed',variable:'#ea580c'};
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let state = load();
let cur = monthKey(new Date());
let tab = 'resumen';
let editing = null;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.months) return s; }catch(e){}
  return {version:1, currency:'EUR', goal:20, months:{}, dismissed:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('No se pudo guardar en este navegador'); } }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function shift(k,n){ const [y,m]=k.split('-').map(Number); return monthKey(new Date(y,m-1+n,1)); }
function mLabel(k){ const [y,m]=k.split('-').map(Number); return MONTHS[m-1]+' '+y; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function items(k){ return (state.months[k] && state.months[k].items) || []; }
function fmt(n){ try{ return new Intl.NumberFormat('es-ES',{style:'currency',currency:state.currency||'EUR'}).format(n||0);}catch(e){return (n||0).toFixed(2)+' €';} }
function pct(n){ return (isFinite(n)?Math.round(n):0)+'%'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function parseAmt(s){ s=String(s).trim().replace(/\s|€/g,''); if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); } const n=parseFloat(s); return isFinite(n)?Math.abs(Math.round(n*100)/100):NaN; }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2200); }

function totals(k){
  const it = items(k);
  const t = {inc:0, exp:0, byGroup:{nomina:0,extra:0,fijo:0,suscripcion:0,variable:0}, byCat:{}, needs:0, wants:0, saveCat:0};
  for(const i of it){
    if(i.type==='ingreso'){ t.inc+=i.amount; }
    else { t.exp+=i.amount; t.byCat[i.category]=(t.byCat[i.category]||0)+i.amount;
      if(i.category==='Ahorro / inversión') t.saveCat+=i.amount; else if(NEEDS.has(i.category)) t.needs+=i.amount; else t.wants+=i.amount; }
    t.byGroup[i.group]=(t.byGroup[i.group]||0)+i.amount;
  }
  t.saved = t.inc - t.exp + t.saveCat;      // lo apartado a ahorro/inversión cuenta como ahorro
  t.spent = t.exp - t.saveCat;               // gasto real (sin contar lo que mandas a ahorro)
  t.rate = t.inc>0 ? t.saved/t.inc*100 : 0;
  return t;
}
function lastMonthWithData(before){
  const keys = Object.keys(state.months).filter(k=>k<before && items(k).length).sort();
  return keys[keys.length-1];
}

/* ---------- Render ---------- */
function render(){
  document.getElementById('monthTitle').textContent = tab==='anio' ? 'Año '+cur.slice(0,4) : mLabel(cur);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['resumen','mov','anio','ajustes'].forEach(v=>document.getElementById('view-'+v).classList.toggle('hidden',v!==tab));
  document.getElementById('fab').classList.toggle('hidden', tab==='ajustes'||tab==='anio');
  document.querySelector('header.top').classList.toggle('hidden', tab==='ajustes');
  if(tab==='resumen') renderResumen();
  if(tab==='mov') renderMov();
  if(tab==='anio') renderAnio();
  if(tab==='ajustes') renderAjustes();
}

function copyBanner(){
  if(items(cur).length) return '';
  const prev = lastMonthWithData(cur);
  if(!prev) return '';
  const rec = items(prev).filter(i=>i.recurring);
  if(!rec.length) return '';
  return `<div class="banner">Este mes está vacío. ¿Copiar tus <b>${rec.length}</b> movimientos fijos de <b>${mLabel(prev)}</b> (nómina, gastos fijos y suscripciones)?
    <div class="row"><button class="btn" data-act="copy" data-from="${prev}">Copiar fijos</button></div></div>`;
}

function renderResumen(){
  const el = document.getElementById('view-resumen');
  const t = totals(cur);
  const it = items(cur);
  if(!it.length){
    el.innerHTML = copyBanner() + `<div class="card empty">
      <div style="font-size:40px">💶</div>
      <p><b>Empieza con ${mLabel(cur)}</b></p>
      <p class="note">Añade tu nómina, tus gastos fijos (alquiler, luz, seguros…), tus suscripciones y lo que vayas gastando. Pulsa el botón <b>+</b>.</p>
      ${Object.keys(state.months).length?'':`<button class="btn ghost" data-act="demo">Ver con datos de ejemplo</button>`}
    </div>`;
    return;
  }
  const prevK = shift(cur,-1), pt = totals(prevK), hasPrev = items(prevK).length>0;
  const diff = (a,b)=> hasPrev ? `<div class="s">${a>=b?'▲':'▼'} ${fmt(Math.abs(a-b))} vs mes anterior</div>` : '';
  let h = `<div class="kpis">
    <div class="kpi"><div class="l">Ingresos</div><div class="v pos">${fmt(t.inc)}</div>${diff(t.inc,pt.inc)}</div>
    <div class="kpi"><div class="l">Gastos</div><div class="v" style="color:var(--out)">${fmt(t.spent)}</div>${diff(t.spent,pt.spent)}</div>
    <div class="kpi"><div class="l">Ahorrado</div><div class="v ${t.saved>=0?'pos':'neg'}">${fmt(t.saved)}</div>${diff(t.saved,pt.saved)}</div>
    <div class="kpi"><div class="l">% ahorro</div><div class="v ${t.rate>=state.goal?'pos':(t.rate<0?'neg':'')}">${pct(t.rate)}</div><div class="s">Objetivo: ${state.goal}%</div></div>
  </div>`;

  // Fijo / subs / variable stack
  const g = t.byGroup, gt = (g.fijo+g.suscripcion+g.variable)||1;
  h += `<div class="card"><h2>¿Cómo se reparte tu gasto?</h2>
    <div class="stack">${['fijo','suscripcion','variable'].map(k=>`<i style="width:${g[k]/gt*100}%;background:${GROUP_COLOR[k]}"></i>`).join('')}</div>
    <div class="legend">${['fijo','suscripcion','variable'].map(k=>`<span><b style="background:${GROUP_COLOR[k]}"></b>${GROUP_LABEL[k]}: <strong style="color:var(--ink)">${fmt(g[k])}</strong></span>`).join('')}</div>
    ${t.inc>0?`<p class="note" style="margin:12px 0 0">De cada 100 € que entran: <b>${Math.round(t.needs/t.inc*100)} €</b> van a necesidades, <b>${Math.round(t.wants/t.inc*100)} €</b> a caprichos y estilo de vida y <b>${Math.max(0,Math.round(t.saved/t.inc*100))} €</b> se ahorran.</p>`:''}
  </div>`;

  // Categories
  const cats = Object.entries(t.byCat).filter(([c])=>c!=='Ahorro / inversión').sort((a,b)=>b[1]-a[1]);
  const max = cats.length?cats[0][1]:1;
  if(cats.length){
    h += `<div class="card"><h2>¿En qué gastas más? <small>${mLabel(cur)}</small></h2>` + cats.map(([c,v])=>{
      const p = pt.byCat[c]||0;
      let d = '';
      if(hasPrev){ if(!p) d='Nuevo este mes'; else { const ch=(v-p)/p*100; d = Math.abs(ch)<1?'Igual que el mes anterior':(ch>0?`▲ ${Math.round(ch)}% más que el mes anterior`:`▼ ${Math.round(-ch)}% menos que el mes anterior`);} }
      return `<div class="catrow"><span class="n">${esc(c)}</span><span class="a">${fmt(v)} <span class="note">${t.spent?Math.round(v/t.spent*100):0}%</span></span>
        <div class="bar"><i style="width:${v/max*100}%"></i></div>${d?`<span class="d">${d}</span>`:''}</div>`;
    }).join('') + `</div>`;
  }

  // Tips
  h += `<div class="card"><h2>Consejos para mejorar</h2>${tips(t,pt,hasPrev).map(x=>`<div class="tip ${x[0]}"><span class="ic">${x[1]}</span><span>${x[2]}</span></div>`).join('')}</div>`;
  el.innerHTML = h;
}

function tips(t,pt,hasPrev){
  const out=[];
  const goal=state.goal;
  if(t.inc===0) out.push(['warn','💡','No has apuntado ingresos este mes. Añade tu nómina para calcular tu ahorro.']);
  else if(t.saved<0) out.push(['bad','🚨',`Este mes gastas <b>${fmt(-t.saved)}</b> más de lo que ingresas. Revisa los gastos variables más altos de abajo.`]);
  else if(t.rate>=goal) out.push(['good','🎉',`¡Bien! Ahorras el <b>${pct(t.rate)}</b> de tus ingresos, por encima de tu objetivo del ${goal}%.`]);
  else { const need=t.inc*goal/100 - t.saved; out.push(['warn','🎯',`Ahorras el ${pct(t.rate)}. Para llegar a tu objetivo del ${goal}% te faltan <b>${fmt(need)}</b> este mes.`]); }

  const subs = items(cur).filter(i=>i.type==='gasto'&&i.group==='suscripcion');
  const subT = subs.reduce((a,i)=>a+i.amount,0);
  if(subs.length) out.push(['info','📺',`Pagas <b>${subs.length}</b> suscripciones: <b>${fmt(subT)}</b> al mes, que son <b>${fmt(subT*12)}</b> al año. ¿Usas todas? Cancelar ${subs.length>1?'la más cara':'esta'} (${esc(subs.slice().sort((a,b)=>b.amount-a.amount)[0].name)}) te ahorraría ${fmt(subs.slice().sort((a,b)=>b.amount-a.amount)[0].amount*12)} al año.`]);

  if(t.inc>0){
    if(t.needs/t.inc>0.5) out.push(['warn','🏠',`Tus gastos básicos (vivienda, facturas, comida, transporte…) son el <b>${pct(t.needs/t.inc*100)}</b> de tus ingresos. La regla 50/30/20 recomienda no pasar del 50%. Comparar tarifas de luz, internet, móvil o seguros suele ser lo más fácil de recortar.`]);
    if(t.wants/t.inc>0.3) out.push(['warn','🛍️',`Ocio, restaurantes, compras y caprichos suponen el <b>${pct(t.wants/t.inc*100)}</b> de tus ingresos (lo recomendable es ~30%). Recortar ahí hasta el 30% te dejaría <b>${fmt(t.wants-t.inc*0.3)}</b> más al mes.`]);
  }
  if(hasPrev){
    const ups = Object.entries(t.byCat).filter(([c,v])=>c!=='Ahorro / inversión' && (pt.byCat[c]||0)>0 && v-(pt.byCat[c])>=20 && v/(pt.byCat[c])>=1.15).sort((a,b)=>(b[1]-pt.byCat[b[0]])-(a[1]-pt.byCat[a[0]])).slice(0,2);
    for(const [c,v] of ups) out.push(['warn','📈',`<b>${esc(c)}</b> ha subido ${fmt(v-pt.byCat[c])} respecto al mes anterior (${fmt(pt.byCat[c])} → ${fmt(v)}).`]);
    const downs = Object.entries(pt.byCat).filter(([c,v])=>c!=='Ahorro / inversión' && v-(t.byCat[c]||0)>=20).sort((a,b)=>(b[1]-(t.byCat[b[0]]||0))-(a[1]-(t.byCat[a[0]]||0))).slice(0,1);
    for(const [c,v] of downs) out.push(['good','👏',`Has gastado ${fmt(v-(t.byCat[c]||0))} menos en <b>${esc(c)}</b> que el mes anterior.`]);
    if(t.saved>pt.saved && pt.inc>0) out.push(['good','💪',`Has ahorrado ${fmt(t.saved-pt.saved)} más que el mes anterior.`]);
  }
  const top = Object.entries(t.byCat).filter(([c])=>!NEEDS.has(c)&&c!=='Ahorro / inversión').sort((a,b)=>b[1]-a[1])[0];
  if(top && t.inc>0 && top[1]>=50) out.push(['info','✂️',`Tu mayor gasto no esencial es <b>${esc(top[0])}</b> (${fmt(top[1])}). Si lo reduces un 20% ahorrarías ${fmt(top[1]*0.2)} al mes, ${fmt(top[1]*0.2*12)} al año.`]);
  return out;
}

function renderMov(){
  const el = document.getElementById('view-mov');
  const it = items(cur);
  if(!it.length){ el.innerHTML = copyBanner()+`<div class="card empty"><p>No hay movimientos en ${mLabel(cur)}.</p><p class="note">Pulsa <b>+</b> para añadir el primero.</p></div>`; return; }
  const order = ['nomina','extra','fijo','suscripcion','variable'];
  let rows='';
  for(const g of order){
    const list = it.filter(i=>i.group===g).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||b.amount-a.amount);
    if(!list.length) continue;
    const isIn = g==='nomina'||g==='extra';
    const sum = list.reduce((a,i)=>a+i.amount,0);
    rows += `<tr class="sec"><td colspan="2">${GROUP_LABEL[g]}</td><td class="num ${isIn?'pos':''}">${isIn?'+':'−'}${fmt(sum)}</td></tr>`;
    rows += list.map(i=>`<tr class="item" data-id="${i.id}"><td>${esc(i.name)}${i.recurring?'<span class="pill">mensual</span>':''}<span class="sub">${esc(i.category)}</span></td>
      <td class="note">${i.date?i.date.slice(8,10)+'/'+i.date.slice(5,7):''}</td>
      <td class="num ${isIn?'pos':''}">${isIn?'+':'−'}${fmt(i.amount)}</td></tr>`).join('');
  }
  const t = totals(cur);
  el.innerHTML = `<div class="card" style="padding:6px 8px"><table class="sheet">
    <thead><tr><th>Concepto</th><th>Día</th><th class="num">Importe</th></tr></thead>
    <tbody>${rows}
    <tr class="tot"><td colspan="2">Total ingresos</td><td class="num pos">${fmt(t.inc)}</td></tr>
    <tr class="tot"><td colspan="2">Total gastos</td><td class="num" style="color:var(--out)">${fmt(t.exp)}</td></tr>
    <tr class="tot"><td colspan="2">Ahorro del mes${t.saveCat?' <span class="sub">incluye lo apartado a ahorro/inversión</span>':''}</td><td class="num ${t.saved>=0?'pos':'neg'}">${fmt(t.saved)}</td></tr>
    </tbody></table></div>
    <p class="note" style="text-align:center">Toca una fila para editarla o borrarla.</p>`;
}

function renderAnio(){
  const el = document.getElementById('view-anio');
  const y = cur.slice(0,4);
  const ks = Array.from({length:12},(_,i)=>y+'-'+String(i+1).padStart(2,'0'));
  const ts = ks.map(k=>({k,has:items(k).length>0,...totals(k)}));
  const used = ts.filter(x=>x.has);
  const sum = f=>used.reduce((a,x)=>a+x[f],0);
  const maxAbs = Math.max(1,...used.map(x=>Math.abs(x.saved)));
  let acc=0;
  const rows = ts.map(x=>{ if(x.has) acc+=x.saved; return x.has?`<tr class="item" data-month="${x.k}"><td style="text-transform:capitalize">${MONTHS[+x.k.slice(5)-1].slice(0,3)}</td><td class="num pos">${fmt(x.inc)}</td><td class="num">${fmt(x.spent)}</td><td class="num ${x.saved>=0?'pos':'neg'}">${fmt(x.saved)}</td><td class="num">${pct(x.rate)}</td><td class="num">${fmt(acc)}</td></tr>`
    :`<tr><td style="text-transform:capitalize;color:var(--muted)">${MONTHS[+x.k.slice(5)-1].slice(0,3)}</td><td colspan="5" class="note">—</td></tr>`; }).join('');
  // average by category
  const cat={}; used.forEach(x=>Object.entries(x.byCat).forEach(([c,v])=>{ if(c!=='Ahorro / inversión') cat[c]=(cat[c]||0)+v; }));
  const cats = Object.entries(cat).sort((a,b)=>b[1]-a[1]); const cmax = cats.length?cats[0][1]:1;
  const inc=sum('inc'), saved=sum('saved');
  el.innerHTML = `
  <div class="kpis">
    <div class="kpi"><div class="l">Ahorrado en ${y}</div><div class="v ${saved>=0?'pos':'neg'}">${fmt(saved)}</div><div class="s">${used.length} meses con datos</div></div>
    <div class="kpi"><div class="l">Media ahorro/mes</div><div class="v">${fmt(used.length?saved/used.length:0)}</div><div class="s">${pct(inc?saved/inc*100:0)} de tus ingresos</div></div>
  </div>
  <div class="card"><h2>Ahorro mes a mes <small>${y}</small></h2>
    <div class="yearbars">${ts.map(x=>`<div class="col" title="${mLabel(x.k)}: ${fmt(x.saved)}">${x.has?`<i class="${x.saved<0?'n':''}" style="height:${Math.max(2,Math.abs(x.saved)/maxAbs*100)}%"></i>`:''}</div>`).join('')}</div>
    <div class="yearlbl">${MONTHS.map(m=>`<span>${m[0].toUpperCase()}</span>`).join('')}</div>
    <p class="note" style="margin:8px 0 0">Verde: meses en los que ahorraste. Rojo: meses en los que gastaste más de lo que ingresaste.</p>
  </div>
  <div class="card" style="padding:6px 8px"><div class="scroll-x"><table class="sheet" style="min-width:520px">
    <thead><tr><th>Mes</th><th class="num">Ingresos</th><th class="num">Gastos</th><th class="num">Ahorro</th><th class="num">%</th><th class="num">Acumulado</th></tr></thead>
    <tbody>${rows}<tr class="tot"><td>Total</td><td class="num pos">${fmt(inc)}</td><td class="num">${fmt(sum('spent'))}</td><td class="num ${saved>=0?'pos':'neg'}">${fmt(saved)}</td><td class="num">${pct(inc?saved/inc*100:0)}</td><td></td></tr></tbody>
  </table></div></div>
  ${cats.length?`<div class="card"><h2>Gasto medio mensual por categoría</h2>${cats.map(([c,v])=>`<div class="catrow"><span class="n">${esc(c)}</span><span class="a">${fmt(v/used.length)}<span class="note"> /mes</span></span><div class="bar"><i style="width:${v/cmax*100}%"></i></div><span class="d">${fmt(v)} en total en ${y}</span></div>`).join('')}</div>`:''}
  <p class="note" style="text-align:center">Usa ‹ › arriba para cambiar de año. Toca un mes para abrirlo.</p>`;
}

  const el = document.getElementById('view-ajustes');
  const n = Object.values(state.months).reduce((a,m)=>a+(m.items||[]).length,0);
  el.innerHTML = `<h1 style="font-size:22px;margin:calc(16px + env(safe-area-inset-top)) 0 4px">Ajustes</h1>
  <div class="card"><h2>Objetivo de ahorro</h2>
    <label class="f" for="goal">Porcentaje de tus ingresos que quieres ahorrar cada mes</label>
    <div class="row"><input class="inp" id="goal" type="number" min="0" max="100" value="${state.goal}"><button class="btn" data-act="goal" style="flex:0 0 auto">Guardar</button></div>
    <label class="f" for="cur">Moneda</label>
    <select class="inp" id="cur">${['EUR','USD','GBP','MXN','ARS','COP','CLP','PEN','CHF'].map(c=>`<option ${c===state.currency?'selected':''}>${c}</option>`).join('')}</select>
  </div>
  <div class="card"><h2>Tus datos <small>${n} movimientos</small></h2>
    <p class="note" style="margin-top:0">Tus datos se guardan <b>solo en este móvil</b>, no en ningún servidor: nadie más puede verlos. Por eso conviene hacer una copia de seguridad de vez en cuando.</p>
    <button class="btn block" data-act="csv">📄 Exportar a Excel (CSV)</button>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" data-act="backup">💾 Copia de seguridad</button>
      <button class="btn ghost" data-act="restore">📂 Restaurar copia</button>
    </div>
    <p class="note">La copia de seguridad también sirve para pasar tus datos a otro móvil.</p>
  </div>
  <div class="card"><h2>Instalar en el móvil</h2>
    <p class="note" style="margin:0"><b>iPhone (Safari):</b> botón Compartir → «Añadir a pantalla de inicio».<br><b>Android (Chrome):</b> menú ⋮ → «Instalar aplicación» o «Añadir a pantalla de inicio».<br>Funciona sin conexión y sin crear ninguna cuenta.</p>
  </div>
  <div class="card"><h2>Zona peligrosa</h2>
    <button class="btn danger block" data-act="wipe">Borrar todos mis datos</button>

/* ---------- Modal ---------- */
const $ = id=>document.getElementById(id);
let mType='gasto', mGroup='variable';
function setType(t, keepGroup){
  mType=t;
  $('mType').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));
  $('mType').className='seg '+(t==='gasto'?'out':'in');
  if(!keepGroup) mGroup = t==='gasto'?'variable':'nomina';
  $('mGroup').innerHTML = GROUPS[t].map(([v,l])=>`<button data-v="${v}" class="${v===mGroup?'on':''}">${l}</button>`).join('');
  const cats = t==='gasto'?EXP_CATS:INC_CATS;
  $('mCat').innerHTML = cats.map(c=>`<option>${esc(c)}</option>`).join('');
  if(!keepGroup) applyGroupDefaults();
}
function applyGroupDefaults(){
  $('mGroup').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===mGroup));
  $('mRec').checked = mGroup!=='variable' && mGroup!=='extra';
  if(mGroup==='suscripcion') $('mCat').value='Suscripciones';
  if(mGroup==='nomina') $('mCat').value='Nómina';
  if(mGroup==='extra') $('mCat').value='Trabajos extra';
  if(mGroup==='fijo' && $('mCat').value==='Suscripciones') $('mCat').value='Vivienda';
  if(mGroup==='variable' && $('mCat').value==='Suscripciones') $('mCat').value='Supermercado';
}
function openModal(item){
  editing = item||null;
  $('mTitle').textContent = item?'Editar movimiento':'Nuevo movimiento';
  $('mDel').classList.toggle('hidden',!item);
  if(item){ mGroup=item.group; setType(item.type,true); $('mName').value=item.name; $('mAmount').value=String(item.amount).replace('.',','); $('mCat').value=item.category; $('mDate').value=item.date||''; $('mRec').checked=!!item.recurring; }
  else { setType('gasto'); $('mCat').value='Supermercado'; $('mName').value=''; $('mAmount').value='';
    const today=new Date(); $('mDate').value = monthKey(today)===cur ? today.toISOString().slice(0,10) : ''; }
  $('overlay').classList.add('open');
  setTimeout(()=>{ if(!item) $('mName').focus(); },50);
}
function closeModal(){ $('overlay').classList.remove('open'); editing=null; }
function saveModal(){
  const name=$('mName').value.trim(), amount=parseAmt($('mAmount').value);
  if(!name){ toast('Escribe un concepto'); $('mName').focus(); return; }
  if(!(amount>0)){ toast('Escribe un importe válido'); $('mAmount').focus(); return; }
  const data={type:mType,group:mGroup,name,amount,category:$('mCat').value,date:$('mDate').value||'',recurring:$('mRec').checked};
  const m = state.months[cur] || (state.months[cur]={items:[]});
  if(editing){ Object.assign(editing,data); } else m.items.push({id:uid(),...data});
  save(); closeModal(); render(); toast('Guardado');
}

/* ---------- Actions ---------- */
function download(name, content, type){
  const blob = new Blob([content],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function exportCSV(){
  const num = n=>n.toFixed(2).replace('.',',');
  const q = s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=[['Mes','Fecha','Tipo','Grupo','Categoría','Concepto','Importe','Mensual'].join(';')];
  Object.keys(state.months).sort().forEach(k=>items(k).forEach(i=>lines.push([k,i.date,i.type==='ingreso'?'Ingreso':'Gasto',GROUP_LABEL[i.group],q(i.category),q(i.name),(i.type==='ingreso'?'':'-')+num(i.amount),i.recurring?'Sí':'No'].join(';'))));
  lines.push('');
  lines.push(['Mes','Ingresos','Gastos','Ahorro','% ahorro'].join(';'));
  Object.keys(state.months).sort().filter(k=>items(k).length).forEach(k=>{const t=totals(k); lines.push([k,num(t.inc),num(t.spent),num(t.saved),Math.round(t.rate)+'%'].join(';'));});
  download('mis-finanzas.csv','﻿'+lines.join('\r\n'),'text/csv;charset=utf-8');
}
function demo(){
  const base=monthKey(new Date());
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*100)/100;
  for(let n=-3;n<=0;n++){
    const k=shift(base,n); const L=[];
    const add=(type,group,name,amount,category,rec)=>L.push({id:uid(),type,group,name,amount,category,date:'',recurring:!!rec});
    add('ingreso','nomina','Nómina',1850,'Nómina',1);
    if(n===-1) add('ingreso','extra','Venta en Wallapop',60,'Ventas');
    add('gasto','fijo','Alquiler',750,'Vivienda',1);
    add('gasto','fijo','Luz',rnd(45,70),'Suministros (luz, agua, gas, internet)',1);
    add('gasto','fijo','Fibra y móvil',42,'Suministros (luz, agua, gas, internet)',1);
    add('gasto','fijo','Seguro coche',38,'Seguros',1);
    add('gasto','suscripcion','Netflix',13.99,'Suscripciones',1);
    add('gasto','suscripcion','Spotify',11.99,'Suscripciones',1);
    add('gasto','suscripcion','Gimnasio',35,'Deporte',1);
    add('gasto','suscripcion','iCloud',2.99,'Suscripciones',1);
    add('gasto','variable','Supermercado',rnd(220,300),'Supermercado');
    add('gasto','variable','Cenas y cañas',rnd(80,190),'Restaurantes y bares');
    add('gasto','variable','Gasolina',rnd(50,90),'Transporte');
    add('gasto','variable','Compras online',rnd(20,120),'Ropa');
    add('gasto','variable','Cine / planes',rnd(15,60),'Ocio');
    state.months[k]={items:L};
  }
  save(); render(); toast('Datos de ejemplo cargados. Bórralos en Ajustes cuando quieras.');
}

document.addEventListener('click', e=>{
  const tb = e.target.closest('nav.tabs button'); if(tb){ tab=tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const tr = e.target.closest('tr.item[data-id]'); if(tr){ const i=items(cur).find(x=>x.id===tr.dataset.id); if(i) openModal(i); return; }
  const trm = e.target.closest('tr.item[data-month]'); if(trm){ cur=trm.dataset.month; tab='resumen'; render(); window.scrollTo(0,0); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  if(act==='copy'){ const src=items(a.dataset.from).filter(i=>i.recurring); state.months[cur]={items:src.map(i=>({...i,id:uid(),date:i.date?cur+i.date.slice(7):''}))}; save(); render(); toast('Fijos copiados. Ajusta los importes si han cambiado.'); }
  if(act==='demo') demo();
  if(act==='goal'){ const v=Math.max(0,Math.min(100,parseInt($('goal').value)||0)); state.goal=v; save(); toast('Objetivo guardado: '+v+'%'); }
  if(act==='csv') exportCSV();
  if(act==='backup'){ download('mis-finanzas-copia-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,1),'application/json'); }
  if(act==='restore') $('fileIn').click();
  if(act==='wipe'){ if(confirm('¿Seguro? Se borrarán todos tus movimientos de este móvil. Esto no se puede deshacer.')){ state={version:1,currency:state.currency,goal:state.goal,months:{},dismissed:{}}; save(); render(); toast('Datos borrados'); } }
});
document.addEventListener('change', e=>{
  if(e.target.id==='cur'){ state.currency=e.target.value; save(); toast('Moneda cambiada'); }
});
$('fileIn').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const s=JSON.parse(await f.text()); if(!s||!s.months) throw 0;
    if(confirm('Esto reemplazará los datos actuales de este móvil por los de la copia. ¿Continuar?')){ state=Object.assign({version:1,currency:'EUR',goal:20,dismissed:{}},s); save(); render(); toast('Copia restaurada'); }
  }catch(err){ toast('Ese archivo no es una copia válida'); }
  e.target.value='';
});
$('prev').onclick=()=>{ cur=shift(cur, tab==='anio'?-12:-1); render(); };
$('next').onclick=()=>{ cur=shift(cur, tab==='anio'?12:1); render(); };
$('fab').onclick=()=>openModal();
$('mCancel').onclick=closeModal;
$('mSave').onclick=saveModal;
$('mDel').onclick=()=>{ if(editing && confirm('¿Borrar «'+editing.name+'»?')){ const m=state.months[cur]; m.items=m.items.filter(i=>i!==editing); save(); closeModal(); render(); toast('Borrado'); } };
$('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
$('mType').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setType(b.dataset.v); });
$('mGroup').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ mGroup=b.dataset.v; applyGroupDefaults(); } });
$('mAmount').addEventListener('keydown',e=>{ if(e.key==='Enter') saveModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
